name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 01:17 Asia/Bangkok. Future game URLs are prepared 45 days ahead.
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  checks:
    name: Tests before release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and types
        run: |
          npm run lint
          npx tsc --noEmit
      - name: Engine and in-memory PostgreSQL checks
        run: |
          npm test
          npm run test:db
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Browser regression tests (mock API only)
        run: npm run test:e2e
      - name: Retain failure reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  build:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: /FootballTeam
          NEXT_PUBLIC_SITE_URL: https://thitikorngithub.github.io

      - name: Normalize asset directory for GitHub Pages
        run: |
          mv dist/client/FootballTeam/_next dist/client/_next
          rmdir dist/client/FootballTeam
          cp scripts/github-pages-404.html dist/client/404.html

      - name: Generate game share pages from Neon
        run: npm run generate:game-shares

      - name: Check generated Pages routes and assets
        run: npm run check:pages

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
